name: Destrucción v3 con Terraform

on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe DESTRUIR para borrar toda la infraestructura v3'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-3f57bb8c-371e-4b9c-949
  REGION: us-central1
  BUCKET_ESTADO: statsnostra-v3-estado-3f57bb8c
  WIF_PROVIDER: projects/599897195726/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  CUENTA_CI: statsnostra-ci@project-3f57bb8c-371e-4b9c-949.iam.gserviceaccount.com

jobs:
  destruir:
    name: Destruir la infraestructura v3
    runs-on: ubuntu-latest
    steps:
      # Evita que un clic accidental borre todo
      - name: Verificar la confirmación
        env:
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          if [ "$CONFIRMACION" != "DESTRUIR" ]; then
            echo "Confirmación incorrecta: hay que escribir DESTRUIR"
            exit 1
          fi

      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticar con GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CUENTA_CI }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.0
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ env.BUCKET_ESTADO }}"

      # El Service crea un balanceador fuera de Terraform; si sigue vivo, la IP no se libera
      - name: Borrar el Service de Kubernetes
        run: |
          if gcloud container clusters get-credentials statsnostra-v3-gke --zone=${{ env.REGION }}-a; then
            kubectl delete service statsnostra-api-service --ignore-not-found --wait
          else
            echo "El clúster no existe, no hay balanceador que borrar"
          fi

      - name: Esperar a que GCP libere el balanceador
        run: |
          for intento in $(seq 1 30); do
            REGLAS=$(gcloud compute forwarding-rules list --format="value(name)")
            [ -z "$REGLAS" ] && exit 0
            echo "Reglas de reenvío activas: $REGLAS"
            sleep 10
          done
          echo "El balanceador no se liberó a tiempo"
          exit 1

      - name: Terraform destroy
        working-directory: terraform
        run: terraform destroy -input=false -auto-approve

      # Confirma que no queda nada que siga cobrando
      - name: Revisar que no queden recursos
        run: |
          RESTOS=""
          RESTOS="$RESTOS$(gcloud container clusters list --format='value(name)')"
          RESTOS="$RESTOS$(gcloud sql instances list --format='value(name)')"
          RESTOS="$RESTOS$(gcloud redis instances list --region=${{ env.REGION }} --format='value(name)')"
          RESTOS="$RESTOS$(gcloud compute addresses list --format='value(name)')"
          RESTOS="$RESTOS$(gcloud secrets list --format='value(name)')"
          RESTOS="$RESTOS$(gcloud artifacts repositories list --location=${{ env.REGION }} --format='value(name)')"
          if [ -n "$RESTOS" ]; then
            echo "Quedaron recursos: $RESTOS"
            exit 1
          fi
          echo "Proyecto limpio: no queda ningún recurso de la v3"
