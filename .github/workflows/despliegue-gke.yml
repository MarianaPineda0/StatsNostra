name: Despliegue a GKE

on:
  push:
    branches: [develop]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-3f57bb8c-371e-4b9c-949
  IMAGE: us-central1-docker.pkg.dev/project-3f57bb8c-371e-4b9c-949/statsnostra-repo/statsnostra-api
  USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar con GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/599897195726/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: statsnostra-ci@project-3f57bb8c-371e-4b9c-949.iam.gserviceaccount.com
          project_id: project-3f57bb8c-371e-4b9c-949

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-3f57bb8c-371e-4b9c-949

      - name: Fijar proyecto de cuota
        run: |
          gcloud config set project $PROJECT_ID
          gcloud auth application-default set-quota-project $PROJECT_ID

      - name: Instalar plugin de autenticacion de GKE
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Construir imagen (Cloud Build + Buildpacks, sin Docker)
        run: gcloud builds submit --pack image=$IMAGE:${{ github.sha }} --project=$PROJECT_ID

      - name: Conectar al cluster
        run: gcloud container clusters get-credentials statsnostra-gke --zone=us-central1-a --project=$PROJECT_ID

      - name: Desplegar
        run: |
          kubectl set image deployment/statsnostra-api api=$IMAGE:${{ github.sha }}
          kubectl rollout status deployment/statsnostra-api --timeout=180s
