apiVersion: apps/v1
kind: Deployment
metadata:
  name: statsnostra-api
  namespace: statsnostra
  labels:
    app: statsnostra-api
spec:
  # Réplicas fijas: la ronda 0 del experimento de CPU se mide así, sin HPA
  replicas: 2
  selector:
    matchLabels:
      app: statsnostra-api
  template:
    metadata:
      labels:
        app: statsnostra-api
    spec:
      # Una réplica por nodo cuando se puede: si saturamos la CPU de un pod, la
      # otra réplica no comparte nodo y el experimento afecta a un solo pod
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: statsnostra-api

      containers:
        - name: api
          image: "${IMAGE}"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: statsnostra-config
            - secretRef:
                name: statsnostra-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          # Rutas distintas: liveness decide si se reinicia el contenedor y
          # readiness si recibe tráfico
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        # El API se conecta a 127.0.0.1:5432 y el proxy lo lleva a Cloud SQL
        # con la cuenta de los nodos, sin abrir la base a ninguna red
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.2
          args:
            - "--port=5432"
            - "${CLOUDSQL_CONNECTION_NAME}"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
