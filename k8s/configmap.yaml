apiVersion: v1
kind: ConfigMap
metadata:
  name: statsnostra-config
  namespace: statsnostra
data:
  ENTORNO: "gke"
  LOG_LEVEL: "INFO"

  # Identificación en X-App-Name / X-App-Version y en cada línea de log.
  # APP_VERSION la fija el despliegue con la versión publicada.
  APP_ID: "mari"
  APP_VERSION: "${APP_VERSION}"

  # Interruptor de fallos del grupo: apagado. Cada experimento lo enciende a
  # mano y volver a "false" es el interruptor de parada.
  FAULT_HEADER_ENABLED: "false"
  FAULT_ERROR_RATE: "1.0"
  FAULT_LATENCY_MS: "1000"

  # Readiness que saca del balanceo a un pod saturado: milisegundos de retraso
  # del bucle de eventos a partir de los cuales /health/ready responde 503. 0 la
  # apaga (como en la ronda 0); 50 es el umbral medido en la ronda 0: el pod saturado
  # lo superó en 27 de 36 muestras y el sano en 2 de 36.
  READINESS_LAG_MS: "50"

  # El flujo del grupo entra por el coordinador y este API no llama a las
  # otras nubes: sin URL el cliente externo simplemente no las consulta.
  # Tampoco hay Redis en esta infraestructura.
  TRADING_JOURNAL_API_URL: ""
  ECOMMERCE_API_URL: ""
  REDIS_HOST: ""

  # Grafana Cloud: nombre propio en las métricas. El endpoint y el usuario los pone el
  # despliegue solo si encuentra el token en Secret Manager; vacíos, OpenTelemetry queda
  # apagado. El token va en el Secret, no aquí.
  OTEL_SERVICE_NAME: "statsnostra-api"
  GRAFANA_OTLP_ENDPOINT: "${GRAFANA_OTLP_ENDPOINT}"
  GRAFANA_OTLP_USER: "${GRAFANA_OTLP_USER}"
