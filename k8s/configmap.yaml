apiVersion: v1
kind: ConfigMap
metadata:
  name: statsnostra-config
  namespace: statsnostra
data:
  ENTORNO: "gke"
  LOG_LEVEL: "INFO"

  # Identificación en X-App-Name / X-App-Version y en cada línea de log.
  # APP_VERSION la fija el despliegue con la versión publicada.
  APP_ID: "mari"
  APP_VERSION: "${APP_VERSION}"

  # Interruptor de fallos del grupo: apagado. Cada experimento lo enciende a
  # mano y volver a "false" es el interruptor de parada.
  FAULT_HEADER_ENABLED: "false"
  FAULT_ERROR_RATE: "1.0"
  FAULT_LATENCY_MS: "1000"

  # El flujo del grupo entra por el coordinador y este API no llama a las
  # otras nubes: sin URL el cliente externo simplemente no las consulta.
  # Tampoco hay Redis en esta infraestructura.
  TRADING_JOURNAL_API_URL: ""
  ECOMMERCE_API_URL: ""
  REDIS_HOST: ""

  # Nombre propio en las métricas de Grafana Cloud (el endpoint y el token van
  # en el Secret, y sin ellos OpenTelemetry queda apagado)
  OTEL_SERVICE_NAME: "api-mari"
