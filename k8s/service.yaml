apiVersion: v1
kind: Service
metadata:
  name: statsnostra-api-service
  namespace: statsnostra
spec:
  type: LoadBalancer
  # IP reservada con Terraform: la URL del API no cambia entre despliegues
  loadBalancerIP: "${LB_IP}"
  selector:
    app: statsnostra-api
  ports:
    - port: 80
      targetPort: 8000
