# Plantilla -- no aplicar directo. Crear el Secret real con:
#   kubectl create secret generic statsnostra-secrets \
#     --from-literal=DATABASE_URL="postgresql+psycopg://statsnostra_app:TU_CONTRASENA@127.0.0.1:5432/statsnostra_v2"
apiVersion: v1
kind: Secret
metadata:
  name: statsnostra-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://statsnostra_app:REEMPLAZA_CON_TU_CONTRASENA@127.0.0.1:5432/statsnostra_v2"
