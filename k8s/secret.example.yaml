# Plantilla -- no aplicar directo ni guardar valores reales aquí.
# El despliegue crea el Secret real leyendo la URL de la base desde Secret
# Manager (la contraseña la genera Terraform y nunca pasa por el repositorio):
#
#   gcloud secrets versions access latest --secret=statsnostra-v5-database-url
#
# Las credenciales de Grafana Cloud son opcionales: sin ellas el API funciona y
# OpenTelemetry no se activa.
apiVersion: v1
kind: Secret
metadata:
  name: statsnostra-secrets
  namespace: statsnostra
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://statsnostra_app:REEMPLAZA_CON_LA_CONTRASENA@127.0.0.1:5432/statsnostra_v5"
  GRAFANA_OTLP_ENDPOINT: "https://otlp-gateway-REGION.grafana.net/otlp"
  GRAFANA_OTLP_USER: "REEMPLAZA_CON_TU_INSTANCE_ID"
  GRAFANA_OTLP_TOKEN: "REEMPLAZA_CON_TU_API_TOKEN"
