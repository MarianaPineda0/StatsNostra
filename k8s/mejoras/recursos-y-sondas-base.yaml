# Valores con los que se midió la ronda 0 (los de k8s/deployment.yaml). Sirve para
# volver atrás con caos/acciones/mejoras.sh revertir.
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
