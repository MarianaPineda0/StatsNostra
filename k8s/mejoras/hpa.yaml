# Mejora de la ronda 1 del experimento de agotamiento de CPU. NO se aplica en el
# despliegue normal: la ronda 0 se mide con 2 réplicas fijas, y si el HPA ya
# estuviera puesto no habría nada que comparar. Se aplica a mano al empezar la
# ronda 1:  kubectl apply -f k8s/mejoras/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: statsnostra-api-hpa
  namespace: statsnostra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: statsnostra-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Se mide contra el request (100m): al 60 % son 60m de CPU por pod,
          # así que escala antes de que el pod llegue a su límite de 250m
          averageUtilization: 60
