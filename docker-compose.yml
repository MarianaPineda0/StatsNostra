services:
  db:
    image: postgres:16-alpine
    container_name: statsnostra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-statsnostra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statsnostra}
      POSTGRES_DB: ${POSTGRES_DB:-statsnostra}
      PRUEBAS_DB_PASSWORD: ${PRUEBAS_DB_PASSWORD:-pruebas_local}
      PRODUCCION_DB_PASSWORD: ${PRODUCCION_DB_PASSWORD:-produccion_local}
    ports:
      - "5432:5432"
    volumes:
      - statsnostra_db_data:/var/lib/postgresql/data
      - ./scripts/db/init-schemas.sh:/docker-entrypoint-initdb.d/init-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statsnostra}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  statsnostra_db_data:
