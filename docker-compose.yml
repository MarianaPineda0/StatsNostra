services:
  db:
    image: postgres:16-alpine
    container_name: statsnostra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-statsnostra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statsnostra}
      POSTGRES_DB: ${POSTGRES_DB:-statsnostra}
      PRUEBAS_DB_PASSWORD: ${PRUEBAS_DB_PASSWORD:-pruebas_local}
      PRODUCCION_DB_PASSWORD: ${PRODUCCION_DB_PASSWORD:-produccion_local}
    ports:
      - "5432:5432"
    volumes:
      - statsnostra_db_data:/var/lib/postgresql/data
      - ./scripts/db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statsnostra}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: statsnostra-api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENTORNO: desarrollo
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://statsnostra_pruebas:${PRUEBAS_DB_PASSWORD:-pruebas_local}@db:5432/statsnostra_pruebas
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  statsnostra_db_data:
