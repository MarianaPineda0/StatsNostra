[tool.black]
line-length = 95
target-version = ["py312"]
extend-exclude = "migrations/versions"

[tool.ruff]
line-length = 95
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends(...) en valores por defecto es el patron oficial de FastAPI, no un bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# El informe es una plantilla HTML dentro de un f-string: las líneas largas son el texto
"caos/informe/generar_informe.py" = ["E501"]
# Las filas de la tabla de resultados son texto de Markdown
"seguridad/resumen.py" = ["E501"]
